
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🚌 Bus Management</h1>
        <p>Add, view, update and delete bus details</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="passengers.html">Passengers</a>
        <a href="buses.html">Buses</a>
        <a href="bookings.html">Bookings</a>
    </nav>

    <main class="container">
        <h2>Bus Details</h2>

        <form id="busForm">
            <input type="hidden" id="bus_id">

            <label>Bus Number</label>
            <input type="text" id="bus_number" placeholder="Enter bus number" required>

            <label>Bus Name</label>
            <input type="text" id="bus_name" placeholder="Enter bus name" required>

            <label>Source</label>
            <input type="text" id="source" placeholder="Enter source" required>

            <label>Destination</label>
            <input type="text" id="destination" placeholder="Enter destination" required>

            <label>Total Seats</label>
            <input type="number" id="seats" placeholder="Enter seats" required>

            <label>Fare</label>
            <input type="number" id="fare" placeholder="Enter fare" required>

            <button type="submit">Save Bus</button>
            <button type="button" onclick="resetForm()">Clear</button>
        </form>

        <h2>Available Buses</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Bus Number</th>
                    <th>Bus Name</th>
                    <th>Source</th>
                    <th>Destination</th>
                    <th>Seats</th>
                    <th>Fare</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="busTable"></tbody>
        </table>

        <a href="index.html">⬅ Back to Home</a>
    </main>

    <script src="script.js"></script>
</body>
</html>
