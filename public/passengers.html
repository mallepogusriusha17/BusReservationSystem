
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passenger Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Passenger Management</h1>
        <p>Add, view, update and delete passengers</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="passengers.html">Passengers</a>
        <a href="buses.html">Buses</a>
        <a href="bookings.html">Bookings</a>
    </nav>

    <main class="container">
        <h2>Passenger Details</h2>

        <form id="passengerForm">
            <input type="hidden" id="passenger_id">

            <label>Name</label>
            <input type="text" id="name" placeholder="Enter passenger name" required>

            <label>Age</label>
            <input type="number" id="age" min="1" placeholder="Enter age" required>

            <label>Gender</label>
            <select id="gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>

            <label>Phone</label>
            <input type="text" id="phone" placeholder="Enter phone number" required>

            <button type="submit">Save Passenger</button>
            <button type="button" class="secondary" onclick="resetPassengerForm()">Clear</button>
        </form>

        <p id="passengerMessage" class="message"></p>

        <h2>Passenger List</h2>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Gender</th>
                        <th>Phone</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="passengerTable"></tbody>
            </table>
        </div>

        <a class="back-link" href="index.html">← Back to Home</a>
    </main>

    <script src="script.js"></script>
</body>
</html>
